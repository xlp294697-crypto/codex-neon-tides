name: jiuyue-production

services:
  app:
    image: ${APP_IMAGE:?Set APP_IMAGE to the verified registry image digest}
    restart: unless-stopped
    env_file:
      - ${PRODUCTION_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3002
      DATA_PATH: /app/data/site.db
      TRUST_PROXY: "true"
      COOKIE_SECURE: "true"
      ENABLE_HSTS: "false"
    expose:
      - "3002"
    volumes:
      - production_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    user: "1000:1000"
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      SITE_DOMAIN: ${PRODUCTION_DOMAIN:?Set the production HTTPS domain}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        case "$${SITE_DOMAIN}" in
          example.com|*.example.com|'') echo "Set a real production domain" >&2; exit 1 ;;
        esac
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile.docker:/etc/caddy/Caddyfile:ro
      - production_caddy_data:/data
      - production_caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

volumes:
  production_data:
  production_caddy_data:
  production_caddy_config:

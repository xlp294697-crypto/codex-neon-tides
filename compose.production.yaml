name: jiuyue-production

services:
  app:
    image: ${APP_IMAGE:?Set APP_IMAGE to the verified registry image digest}
    restart: unless-stopped
    env_file:
      - ${PRODUCTION_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3002
      DATA_PATH: /app/data/site.db
      TRUST_PROXY: "true"
      COOKIE_SECURE: "true"
      ENABLE_HSTS: "false"
    expose:
      - "3002"
    ports:
      - "127.0.0.1:${PRODUCTION_APP_PORT:-3002}:3002"
    volumes:
      - production_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  production_data:

name: Release

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions: {}

# Keep the staging -> approval -> production chain serialized, including retries.
concurrency:
  group: release-main
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify-ci:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      - name: Verify successful main CI for the exact release commit
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          current=$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$current" = "$RELEASE_SHA"
          count=$(gh api "repos/$REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&head_sha=$RELEASE_SHA&status=success" --jq .total_count)
          test "$count" -gt 0
          printf 'sha=%s\n' "$RELEASE_SHA" >> "$GITHUB_OUTPUT"

  build:
    needs: verify-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.verify-ci.outputs.sha }}
          persist-credentials: false
      - name: Build release image once
        env:
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ needs.verify-ci.outputs.sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/${REPOSITORY,,}:$RELEASE_SHA"
          docker build --label "org.opencontainers.image.revision=$RELEASE_SHA" -t "$image" .
          docker save --output "$RUNNER_TEMP/release.tar" "$image"
          printf '{}\n' > "$RUNNER_TEMP/trivy.yaml"
      # The release build may resolve newer Alpine security packages than CI.
      # Scan this exact build before publishing; never rebuild after this gate.
      - name: Scan release image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: image
          input: ${{ runner.temp }}/release.tar
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          timeout: 10m
          cache: false
          trivy-config: ${{ runner.temp }}/trivy.yaml
        env:
          TRIVY_IGNOREFILE: /dev/null
      - name: Publish and capture the registry digest
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          RELEASE_SHA: ${{ needs.verify-ci.outputs.sha }}
        run: |
          set -euo pipefail
          repository="ghcr.io/${REPOSITORY,,}"
          image="$repository:$RELEASE_SHA"
          trap 'docker logout ghcr.io >/dev/null 2>&1' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          docker push "$image"
          qualified=$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')
          [[ "$qualified" == "$repository@sha256:"* ]]
          digest="${qualified#*@}"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf 'image=%s\ndigest=%s\n' "$qualified" "$digest" >> "$GITHUB_OUTPUT"
          printf 'Release commit: `%s`\n\nImage: `%s`\n' "$RELEASE_SHA" "$qualified" >> "$GITHUB_STEP_SUMMARY"

  staging:
    needs: [verify-ci, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.verify-ci.outputs.sha }}
          persist-credentials: false
      - name: Deploy and smoke test staging
        run: bash deploy/ssh-release.sh staging
        env:
          APP_IMAGE: ${{ needs.build.outputs.image }}
          RELEASE_SHA: ${{ needs.verify-ci.outputs.sha }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          SMOKE_BASE_URL: ${{ secrets.SMOKE_BASE_URL }}
          SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}

  production:
    needs: [verify-ci, build, staging]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Required reviewers MUST be configured on this GitHub Environment.
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.verify-ci.outputs.sha }}
          persist-credentials: false
      - name: Deploy the staging-verified digest and smoke test production
        run: bash deploy/ssh-release.sh production
        env:
          APP_IMAGE: ${{ needs.build.outputs.image }}
          RELEASE_SHA: ${{ needs.verify-ci.outputs.sha }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          SMOKE_BASE_URL: ${{ secrets.SMOKE_BASE_URL }}
          SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
